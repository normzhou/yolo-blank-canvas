<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feedback</title><link rel="stylesheet" href="/feedback/styles.css"><script src="/feedback/client.mjs" type="module"></script></head><body><main><a class="back" href="/">← Back to the app</a><h1>Make it better.</h1><p class="intro">Share a problem, an idea, or something we should know.</p><p id="notice" role="status" aria-live="polite">Loading…</p><section id="composer" hidden><form id="request-form"><label for="type">What would you like to share?</label><select id="type"></select><div id="fields"></div><p class="hint">Share nonsecret feedback. Leave out passwords, account details and private logs.</p><button id="send" type="submit">Send feedback</button></form><button id="new-request" type="button" hidden>Start a new request from this draft</button></section><section><div class="heading"><h2>Your requests</h2><button id="refresh" type="button">Refresh</button></div><div id="requests"></div></section><section id="thread" hidden><h2 id="thread-title"></h2><p id="thread-status"></p><div id="messages"></div><form id="reply-form"><label for="reply">Add a reply</label><textarea id="reply" maxlength="4000" rows="4"></textarea><button type="submit">Send reply</button><button id="new-reply" type="button" hidden>Start a new reply from this draft</button></form></section></main></body></html>
