<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="YOLO Arcade icon">
  <defs>
    <!-- 1990s Royal Purple-to-Indigo Arcade Sky -->
    <radialGradient id="arcadeSky" cx="50%" cy="38%" r="68%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="52%" stop-color="#3b0764" />
      <stop offset="100%" stop-color="#13072e" />
    </radialGradient>

    <!-- 90s Gold-to-Magenta Neon Cabinet Bezel -->
    <linearGradient id="neonRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- 90s Comic Action Starburst Gradient -->
    <radialGradient id="starburstGrad" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.52" />
      <stop offset="65%" stop-color="#f97316" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.1" />
    </radialGradient>

    <!-- Control Deck Gradient -->
    <linearGradient id="controlDeck" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glossy Cherry-Red Sanwa Arcade Ball-Top -->
    <radialGradient id="cherryBall" cx="34%" cy="28%" r="66%">
      <stop offset="0%" stop-color="#ffab91" />
      <stop offset="28%" stop-color="#ff3d00" />
      <stop offset="78%" stop-color="#c62828" />
      <stop offset="100%" stop-color="#6a0000" />
    </radialGradient>

    <!-- Luminous Electric-Cyan Astral Star-Core -->
    <radialGradient id="cyanStarCore" cx="34%" cy="28%" r="66%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="85%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </radialGradient>
  </defs>

  <!-- 1. Squircle Arcade Sky Background -->
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#arcadeSky)" />

  <!-- 2. 1990s Golden-Orange Comic Action Starburst -->
  <g transform="translate(500, 420)">
    <polygon
      points="0,-360 68,-140 315,-250 142,-28 380,68 120,104 235,315 16,158 -160,335 -94,110 -345,115 -140,-16 -315,-220 -68,-140"
      fill="url(#starburstGrad)"
    />
  </g>

  <!-- 3. Floating 3D Golden Prism Cluster (Upper Right) -->
  <g transform="translate(722, 252) rotate(14)" stroke="#090d16" stroke-width="20" stroke-linejoin="round">
    <rect x="-126" y="-42" width="84" height="84" rx="22" fill="#facc15" />
    <rect x="-42" y="-42" width="84" height="84" rx="22" fill="#facc15" />
    <rect x="42" y="-42" width="84" height="84" rx="22" fill="#facc15" />
    <rect x="-42" y="-126" width="84" height="84" rx="22" fill="#fde047" />
    <!-- Specular Prism Glints -->
    <rect x="-24" y="-108" width="34" height="14" rx="7" fill="#ffffff" stroke="none" />
    <rect x="-108" y="-24" width="34" height="14" rx="7" fill="#ffffff" stroke="none" />
    <rect x="-24" y="-24" width="34" height="14" rx="7" fill="#ffffff" stroke="none" />
    <rect x="60" y="-24" width="34" height="14" rx="7" fill="#ffffff" stroke="none" />
  </g>

  <!-- 4. Astral Electric-Cyan Starlight Core (Middle Right) -->
  <g transform="translate(752, 504)">
    <circle r="104" fill="url(#cyanStarCore)" stroke="#090d16" stroke-width="22" />
    <circle r="76" fill="none" stroke="#ffffff" stroke-width="10" stroke-opacity="0.72" />
    <polygon points="0,-48 14,-14 48,0 14,14 0,48 -14,14 -48,0 -14,-14" fill="#ffffff" fill-opacity="0.92" />
  </g>

  <!-- 5. 90s 4-Point Arcade Pixel Sparkles -->
  <path d="M 488 148 L 502 182 L 536 196 L 502 210 L 488 244 L 474 210 L 440 196 L 474 182 Z" fill="#fde047" />
  <path d="M 548 482 L 560 512 L 590 524 L 560 536 L 548 566 L 536 536 L 506 524 L 536 512 Z" fill="#fde047" />

  <!-- 6. Chunky 90s Arcade Control Deck Hugging the Squircle Bottom Curve -->
  <path
    d="M 38 684 L 986 684 L 986 772 A 216 216 0 0 1 770 988 L 254 988 A 216 216 0 0 1 38 772 Z"
    fill="url(#controlDeck)"
    stroke="#090d16"
    stroke-width="24"
    stroke-linejoin="round"
  />
  <!-- Dual 90s Neon Racing Stripes on Control Panel -->
  <line x1="46" y1="732" x2="978" y2="732" stroke="#38bdf8" stroke-width="16" />
  <line x1="48" y1="762" x2="976" y2="762" stroke="#ec4899" stroke-width="14" />

  <!-- 7. Two Candy Arcade Push-Buttons (Emerald Green & Sunny Yellow) -->
  <g transform="translate(652, 838)">
    <ellipse cx="0" cy="18" rx="72" ry="36" fill="#090d16" />
    <ellipse cx="0" cy="0" rx="68" ry="32" fill="#22c55e" stroke="#090d16" stroke-width="18" />
    <ellipse cx="-18" cy="-7" rx="30" ry="11" fill="#bbf7d0" />
  </g>
  <g transform="translate(812, 788)">
    <ellipse cx="0" cy="18" rx="68" ry="34" fill="#090d16" />
    <ellipse cx="0" cy="0" rx="64" ry="30" fill="#facc15" stroke="#090d16" stroke-width="18" />
    <ellipse cx="-16" cy="-7" rx="28" ry="10" fill="#fef9c3" />
  </g>

  <!-- 8. THE HERO: Joystick Dust-Washer + Tilted Chrome Shaft + Giant Cherry-Red YOLO Ball-Top -->
  <ellipse cx="364" cy="796" rx="150" ry="54" fill="#090d16" />
  <ellipse cx="364" cy="780" rx="130" ry="44" fill="#475569" stroke="#090d16" stroke-width="20" />
  <g transform="translate(364, 772) rotate(-10)">
    <rect x="-34" y="-330" width="68" height="330" rx="22" fill="#e2e8f0" stroke="#090d16" stroke-width="22" />
    <rect x="-12" y="-310" width="18" height="290" fill="#ffffff" />
    <!-- Giant Glossy Cherry-Red Ball-Top with YOLO Threefold Y -->
    <g transform="translate(0, -395)">
      <circle r="218" fill="url(#cherryBall)" stroke="#090d16" stroke-width="26" />
      <ellipse cx="-74" cy="-80" rx="68" ry="38" transform="rotate(-28 -74 -80)" fill="#ffffff" fill-opacity="0.92" />
      <circle cx="-18" cy="-24" r="14" fill="#ffffff" fill-opacity="0.78" />
      <!-- Bold 90s Golden YOLO Threefold Symbol on the Ball-Top -->
      <g transform="rotate(10)">
        <g stroke="#090d16" stroke-width="60" stroke-linecap="round">
          <line x1="0" y1="8" x2="0" y2="124" />
          <line x1="0" y1="8" x2="-100" y2="-50" />
          <line x1="0" y1="8" x2="100" y2="-50" />
        </g>
        <g stroke="#fde047" stroke-width="36" stroke-linecap="round">
          <line x1="0" y1="0" x2="0" y2="116" />
          <line x1="0" y1="0" x2="-100" y2="-58" />
          <line x1="0" y1="0" x2="100" y2="-58" />
        </g>
        <circle r="26" fill="#ffffff" />
      </g>
    </g>
  </g>

  <!-- 9. Outer 90s Neon Gold-to-Pink Squircle Bezel -->
  <rect x="32" y="32" width="960" height="960" rx="220" fill="none" stroke="url(#neonRim)" stroke-width="28" />
</svg>
