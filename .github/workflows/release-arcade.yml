name: Build YOLO Arcade Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: '--target universal-apple-darwin'
          - os: windows-latest
            args: ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build Tauri desktop bundles (macOS .dmg/.app & Windows .exe/.msi)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '[yolo] ${{ github.ref_name }} — YOLO Arcade'
          releaseBody: 'Download **yolo-arcade** for macOS (`yolo-arcade-macos.dmg`), Windows (`yolo-arcade-windows-setup.exe`), or Android (`yolo-arcade-android.apk`), or play instantly at https://demo.yolo-dev.ai.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Attach stable macOS filename alias (yolo-arcade-macos.dmg)
        if: matrix.os == 'macos-latest' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for dmg in src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg; do
            cp "$dmg" yolo-arcade-macos.dmg
            gh release upload "${{ github.ref_name }}" yolo-arcade-macos.dmg --clobber
            break
          done

      - name: Attach stable Windows filename alias (yolo-arcade-windows-setup.exe)
        if: matrix.os == 'windows-latest' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for exe in src-tauri/target/release/bundle/nsis/*-setup.exe; do
            cp "$exe" yolo-arcade-windows-setup.exe
            gh release upload "${{ github.ref_name }}" yolo-arcade-windows-setup.exe --clobber
            break
          done

  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK & NDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" "platforms;android-34" "build-tools;34.0.0"
          echo "NDK_HOME=${SDK_ROOT}/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Install Rust stable + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Tauri CLI
        run: |
          npm install --no-save @tauri-apps/cli@^2.0.0

      - name: Initialize & build Android APK
        run: |
          npx tauri android init
          npx tauri android build --apk --target aarch64

      - name: Sign Android APK for direct sideloading
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          keytool -genkeypair -v -keystore /tmp/yolo-arcade.keystore -alias yolo-arcade -keyalg RSA -keysize 2048 -validity 10000 -storepass yoloarcade -keypass yoloarcade -dname "CN=YOLO Arcade, O=YOLO Dev, C=US"
          for apk in src-tauri/gen/android/app/build/outputs/apk/*/*/*.apk; do
            "${SDK_ROOT}/build-tools/34.0.0/zipalign" -v -p 4 "$apk" /tmp/yolo-arcade-aligned.apk
            "${SDK_ROOT}/build-tools/34.0.0/apksigner" sign --ks /tmp/yolo-arcade.keystore --ks-pass pass:yoloarcade --key-pass pass:yoloarcade --out yolo-arcade-android.apk /tmp/yolo-arcade-aligned.apk
            break
          done

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yolo-arcade-android-apk
          path: yolo-arcade-android.apk

      - name: Attach Android APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3 4 5; do
            gh release upload "${{ github.ref_name }}" yolo-arcade-android.apk --clobber && break
            sleep 10
          done

  publish-latest:
    name: Promote Release to Latest After Installers Upload
    needs: [build-desktop, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Mark release as latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --latest
