body:
    - attributes:
        value: Include only nonsecret information appropriate to this repository. Submission does not grant admission or execution. Report sensitive security issues only through an established private channel.
      type: markdown
    - attributes:
        description: Keep this editable identifier for decoding; it is not approval.
        label: Request template
        value: yolo.bug@1.0.0
      id: yolo_template
      type: input
      validations:
        required: true
    - attributes:
        description: Describe observed behavior.
        label: What happened?
      id: observed
      type: textarea
      validations:
        required: true
    - attributes:
        description: Optional expected outcome.
        label: What did you expect?
      id: expected
      type: textarea
      validations:
        required: false
    - attributes:
        description: If known; a missing reproduction does not prevent reporting.
        label: How can we reproduce it?
      id: reproduction
      type: textarea
      validations:
        required: false
    - attributes:
        description: Optional observed version/environment and sanitized evidence; no private logs or credentials.
        label: Context
      id: context
      type: textarea
      validations:
        required: false
description: yolo.bug@1.0.0
name: Report a problem
