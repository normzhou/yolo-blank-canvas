body:
    - attributes:
        value: Include only nonsecret information appropriate to this repository. Submission does not grant admission or execution. Report sensitive security issues only through an established private channel.
      type: markdown
    - attributes:
        description: Keep this editable identifier for decoding; it is not approval.
        label: Request template
        value: yolo.feature@1.0.0
      id: yolo_template
      type: input
      validations:
        required: true
    - attributes:
        description: Describe the need or desired outcome.
        label: What are you trying to accomplish?
      id: need
      type: textarea
      validations:
        required: true
    - attributes:
        description: Examples are welcome; priority is decided by the receiver.
        label: Who would benefit, and how?
      id: impact
      type: textarea
      validations:
        required: false
    - attributes:
        description: Optional; you do not need to design the solution.
        label: Suggested approach
      id: proposal
      type: textarea
      validations:
        required: false
    - attributes:
        description: Optional observed version/environment and sanitized evidence; no private logs or credentials.
        label: Context
      id: context
      type: textarea
      validations:
        required: false
description: yolo.feature@1.0.0
name: Suggest a feature
